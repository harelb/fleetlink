name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # pure-Python tests; the ROS / zenoh integration tests skip without ROS and eclipse-zenoh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy msgpack zstandard PyYAML pytest opencv-python-headless Pillow scipy
      - name: Unit tests
        run: python -m pytest -q -rs

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
