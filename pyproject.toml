# Tool configuration only; the package is built by setup.py (ament_python / pip).

[tool.pytest.ini_options]
testpaths = ["tests"]
# the package from this checkout, and the tests' helper modules (conftest, helpers, harness)
pythonpath = [".", "tests"]
# ROS's launch_testing pytest plugins (on the path once ROS is sourced) end the whole
# session at the first module-level skip; these tests do not use them
addopts = "-p no:launch_testing -p no:launch_ros"
markers = ["integration: needs a zenoh router / ROS / real data"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tools"]
